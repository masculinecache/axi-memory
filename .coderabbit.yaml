reviews:
  profile: "assertive"
  path_filters:
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
  review_instructions: |
    Focus on data persistence and retrieval patterns.
    Check memory schema migrations are backwards compatible.
    Verify indexing strategy supports efficient queries.
    Flag hardcoded paths that break portability.
