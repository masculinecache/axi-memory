name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: |
          shellcheck -S error ./mem
          shellcheck -S error ./tests/run.sh
      - name: Run tests
        run: ./tests/run.sh

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify packed contents (dry run)
        run: npm publish --dry-run
      - name: Clean-prefix install and smoke test
        run: |
          npm i -g . --prefix /tmp/memtest
          /tmp/memtest/bin/mem --help >/dev/null
          /tmp/memtest/bin/mem --version
          test "$(/tmp/memtest/bin/mem --version)" = "mem 0.1.0"
